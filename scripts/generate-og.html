<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1200" height="630"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, 1200, 630);

    // Gradient overlay
    const gradient = ctx.createRadialGradient(300, 300, 0, 300, 300, 600);
    gradient.addColorStop(0, 'rgba(99, 102, 241, 0.15)');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1200, 630);

    // Grid pattern
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 1200; i += 60) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, 630);
      ctx.stroke();
    }
    for (let i = 0; i < 630; i += 60) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(1200, i);
      ctx.stroke();
    }

    // Tag
    ctx.fillStyle = '#6366f1';
    ctx.fillRect(80, 120, 4, 24);
    ctx.font = '600 16px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#6366f1';
    ctx.letterSpacing = '2px';
    ctx.fillText('CRYPTO PRODUCT MARKETER', 100, 138);

    // Main heading
    ctx.font = '600 72px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#f5f5f5';
    ctx.fillText('Launch copy and', 80, 240);
    ctx.fillText('growth content that', 80, 330);
    ctx.fillText('moves numbers.', 80, 420);

    // Stats
    ctx.font = '300 28px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#a3a3a3';
    ctx.fillText('26,000 users  •  $120K volume  •  Zero ad spend', 80, 500);

    // Name
    ctx.font = '500 20px monospace';
    ctx.fillStyle = '#737373';
    ctx.fillText('Sakib Imam', 80, 570);

    // Download
    const link = document.createElement('a');
    link.download = 'og-image.png';
    link.href = canvas.toDataURL();
    link.click();
  </script>
</body>
</html>
